<div class="min-vh-100 d-flex align-items-center bg-light" 
     style="background-image: linear-gradient(rgba(255,255,255,0.8), rgba(255,255,255,0.8)), 
            url('https://images.unsplash.com/photo-1523348837708-15d4a09cfac2?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80'); 
            background-size: cover; background-position: center;">
  
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        
        <div class="card shadow-lg border-0 rounded-4">
          <div class="card-body p-5">
            
            <div class="text-center mb-4">
              <div class="display-4 text-success mb-2">
                <i class="bi bi-droplet-half"></i>
              </div>
              <h2 class="fw-bold text-dark">Smart Crop</h2>
              <p class="text-muted">Gestión de Regadío Inteligente</p>
            </div>

            <form>
              <div class="form-floating mb-3">
                <input 
                  type="email" 
                  class="form-control" 
                  id="email" 
                  name="email" 
                  [(ngModel)]="email" 
                  placeholder="nombre@ejemplo.com">
                <label for="email"><i class="bi bi-envelope me-2"></i>Correo electrónico</label>
              </div>

              <div class="form-floating mb-4">
                <input 
                  type="password" 
                  class="form-control" 
                  id="password" 
                  name="password" 
                  [(ngModel)]="password" 
                  placeholder="Contraseña">
                <label for="password"><i class="bi bi-lock me-2"></i>Contraseña</label>
              </div>

              <div class="d-grid mb-3">
                <button class="btn btn-success btn-lg rounded-pill shadow-sm py-3 fw-bold" 
                type="button"
                (click)="onLogin()">
                  ENTRAR AL SISTEMA
                </button>
              </div>

              <div class="text-center">
                <a href="#" class="text-decoration-none text-success fw-semibold small">
                  ¿Olvidaste tu contraseña?
                </a>
              </div>
            </form>

          </div>
          
          <div class="card-footer bg-success text-white text-center py-3 border-0 rounded-bottom-4">
             ¿No tienes cuenta? <a href="#" class="text-white fw-bold">Regístrate aquí</a>
          </div>
        </div>

        <div class="text-center mt-4 text-muted small">
          <p>© 2026 Smart Crop Manager - TFG Vanesa López<br>
          <i class="bi bi-cpu"></i> Sensorización y Control Automático</p>
        </div>

      </div>
    </div>
  </div>
</div>
