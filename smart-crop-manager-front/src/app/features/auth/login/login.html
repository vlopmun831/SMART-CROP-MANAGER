<div class="min-h-screen flex items-center justify-center p-4 bg-cover bg-center bg-no-repeat"
     style="background-image: url('https://images.unsplash.com/photo-1592158140409-760737a2886a?q=80&w=1600&auto=format&fit=crop');">
  
  <div class="absolute inset-0 bg-slate-900/10 backdrop-blur-sm"></div>

  <div class="relative max-w-md w-full space-y-8 bg-white/95 p-10 rounded-3xl shadow-2xl shadow-slate-900/20 border border-slate-100 transform transition hover:scale-105">
    <div class="text-center">
      <h2 class="text-4xl font-extrabold text-green-900 tracking-tight">Smart Crop</h2>
      <p class="mt-2 text-base text-slate-600 font-medium">Gestión de Regadío Inteligente 🌱</p>
    </div>
    
    <form class="mt-8 space-y-6" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Nombre de Usuario</label>
          <input formControlName="username" type="text"
            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-green-500 outline-none transition-all placeholder:text-slate-400" 
            placeholder="Introduce tu usuario">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Contraseña</label>
          <input formControlName="password" type="password"
            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-green-500 outline-none transition-all placeholder:text-slate-400" 
            placeholder="••••••••">
        </div>
      </div>

      <button type="submit" [disabled]="loginForm.invalid"
        class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-green-200 transition-all disabled:opacity-50 disabled:shadow-none active:scale-95">
        Entrar al Sistema
      </button>
      
      <p class="text-center text-xs text-slate-400 mt-4">Conectado con tus plantas reales 🌿</p>
    </form>
  </div>
</div>
