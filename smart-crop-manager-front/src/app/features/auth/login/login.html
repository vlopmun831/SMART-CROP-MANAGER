<div class="min-h-screen flex items-center justify-center p-6 bg-cover bg-fixed bg-center relative"
     style="background-image: url('https://images.unsplash.com/photo-1523348837708-15d4a09cfac2?q=80&w=2070&auto=format&fit=crop');">
  
  <div class="absolute inset-0 bg-slate-950/60 backdrop-blur-[3px]"></div>

  <div class="relative max-w-md w-full bg-slate-900/40 backdrop-blur-xl p-12 rounded-sm shadow-2xl border border-white/10">
    
    <div class="text-center mb-10">
      <h2 class="text-xs uppercase tracking-[0.5em] text-emerald-500 font-bold mb-2">Acceso Restringido</h2>
      <h1 class="text-4xl font-light text-white tracking-tighter">
        SMART<span class="font-bold">CROP</span>
      </h1>
      <div class="w-12 h-1 bg-emerald-500 mx-auto mt-4"></div>
    </div>
    
    <form class="space-y-6" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="space-y-5">
       <div>
  <label class="block text-[10px] uppercase tracking-widest text-slate-400 mb-2 font-semibold">Identificación de Usuario</label>
  <input formControlName="email" type="email"
    class="w-full bg-white/5 border px-4 py-3 rounded-sm text-white placeholder:text-slate-600 focus:outline-none transition-all font-mono text-sm"
    [ngClass]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched ? 'border-red-500/50 bg-red-500/5' : 'border-white/10 focus:border-emerald-500/50 focus:bg-white/10'"
    placeholder="admin@smartcrop.es">
  
  <!-- Mensaje de error dinámico -->
  @if (loginForm.get('email')?.invalid && loginForm.get('email')?.touched) {
    <p class="text-[10px] text-red-500 mt-2 italic animate-fade-in">
      ⚠️ Formato de correo electrónico no válido
    </p>
  }
</div>

        <div>
          <label class="block text-[10px] uppercase tracking-widest text-slate-400 mb-2 font-semibold">Clave de Acceso</label>
          <input formControlName="password" type="password"
            class="w-full bg-white/5 border border-white/10 px-4 py-3 rounded-sm text-white placeholder:text-slate-600 focus:outline-none focus:border-emerald-500/50 focus:bg-white/10 transition-all font-mono text-sm" 
            placeholder="••••••••">
        </div>
      </div>

      <button type="submit" [disabled]="loginForm.invalid"
        class="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-xs uppercase tracking-[0.2em] font-bold py-4 rounded-sm shadow-lg transition-all disabled:opacity-30 disabled:cursor-not-allowed active:scale-[0.98]">
        Autenticar Sistema
      </button>
      
      <div class="flex items-center justify-between mt-8 border-t border-white/5 pt-6">
        <span class="text-[10px] text-slate-500 uppercase tracking-tighter italic">Terminal: Node_01</span>
        <span class="text-[10px] text-emerald-500/50 font-mono">SSL SECURE CONNECTION</span>
      </div>
    </form>
  </div>
</div>
